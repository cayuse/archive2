# The archive's player subsystem without Kamal, for any node with AirPlay speakers on its LAN:
# the daemon (built from this directory) plus OwnTone. Production on bigballs uses Kamal instead
# (config/deploy.yml, README.md); don't run both on one host.
#
#   cp .env.example .env     # ARCHIVE_URL and NODE_TOKEN (archive: Settings -> Speakers)
#   docker compose up -d --build
services:
  player:
    build: .
    container_name: archive-player
    network_mode: host          # reaches OwnTone on localhost; BIND_HOST in .env keeps the page on the LAN address
    env_file: .env
    volumes:
      - ./data:/data
    depends_on: [owntone]
    restart: unless-stopped

  owntone:
    image: docker.io/owntone/owntone:latest
    container_name: archive-player-owntone
    network_mode: host          # mDNS speaker discovery and PTP timing need the real LAN stack
    environment:
      - UID=1000
      - GID=100
    volumes:
      - ../owntone/owntone.conf:/etc/owntone/owntone.conf:ro
      - ./owntone/cache:/var/cache/owntone
      - ./owntone/media:/srv/media
    restart: unless-stopped
