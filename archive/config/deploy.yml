# Kamal deploy for the Archive app on bigballs (archive.cavaforge.net).
#
# Only the Rails app is managed by Kamal. Postgres (archive-db-1) and Redis
# (archive-redis-1) stay in the docker compose project "archive" on bigballs:
# the database is long-lived state, so it is never recreated by a deploy. (It used to be the
# logical-replication master for standalone jukebox machines; those are retired.)
# The app container joins the compose network and connects by the unique
# container names archive-db-1 / archive-redis-1 (not the generic "db"/"redis"
# aliases), so it can never resolve to another app's Postgres such as
# sauce-postgis. post-app-boot then detaches it from the shared "kamal" network.
#
# Secrets are read from ~/.config/archive/production.env on the deploying
# machine (see .kamal/secrets-common). Runbook: KAMAL_DEPLOY.md.
service: archive
image: cayuse/archive

servers:
  web:
    hosts:
      - 192.168.17.109
    # No kamal-proxy on bigballs: host nginx terminates TLS and proxies to :3000,
    # and LAN clients may hit :3000 directly.
    proxy: false
    options:
      network: archive_default
      publish:
        - "3000:3000"
      health-cmd: "curl -fsS http://localhost:3000/up || exit 1"
      health-interval: 5s
      health-start-period: 10s
      health-timeout: 10s
      health-retries: 3

registry:
  server: ghcr.io
  username: cayuse
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: sauce

# Rails takes ~10s to boot; give it room before Kamal declares failure.
deploy_timeout: 90

builder:
  arch: amd64
  # Build from this working directory, not a clean git clone: the encrypted
  # config/credentials.yml.enc is gitignored but must be in the image
  # (RAILS_MASTER_KEY decrypts it for secret_key_base). Copy it from bigballs
  # ~/archive2/archive/config/ if missing; pre-build refuses to build without it.
  context: .

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_SERVE_STATIC_FILES: "true"
    POSTGRES_USER: postgres
    POSTGRES_HOST: archive-db-1
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://archive-redis-1:6379/1
    APP_HOST: archive.cavaforge.net
    APP_PROTOCOL: https
    FORCE_SSL: "true"
    ASSUME_SSL: "true"
    FORGERY_ORIGIN_CHECK: "true"
    ALLOW_ALL_HOSTS: "false"
    INLINE_AUDIO_PROCESSING: "true"
    USE_SIDEKIQ: "false"
    STORAGE_ROOT: /rails/storage
    ACTIVE_STORAGE_SERVICE: local
    AWS_SES_SMTP_HOST: email-smtp.us-east-2.amazonaws.com
    AWS_SES_SMTP_PORT: "587"
    AWS_SES_SMTP_DOMAIN: cavaforge.net
    MAILER_FROM_EMAIL: noreply@cavaforge.net
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - DATABASE_URL
    - AWS_SES_SMTP_USERNAME
    - AWS_SES_SMTP_PASSWORD

volumes:
  # Active Storage blobs (the music files). Same host path compose used.
  - "/datatank/archive/psql_storage:/rails/storage"
  # Reuse the compose logs volume so log history carries over.
  - "archive_archive_logs:/rails/log"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
