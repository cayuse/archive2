# Peer "gameforge": the test peer, on the development machine. Deployed from gameforge itself.
#   kamal setup -c config/deploy.peer.yml -d gameforge    (first time: accessories + app)
#   kamal deploy -c config/deploy.peer.yml -d gameforge
# Paths live under /home/cayuse/archive-peer/gameforge because this host has no /srv/archive set up
# (no root here); a real peer uses the paths deploy/peer/host-setup.sh creates.
#
# Reached on the private network only, plain HTTP: kamal-proxy publishes 192.168.17.97:3920.
# Set once per host (it is the host's kamal-proxy, shared by every Kamal app there):
#   kamal proxy boot_config set -c config/deploy.peer.yml -d gameforge \
#     --publish-host-ip 192.168.17.97 --http-port 3920 --https-port 3921
servers:
  web:
    hosts:
      - 192.168.17.97
  intake:
    hosts:
      - 192.168.17.97

ssh:
  user: cayuse          # stands in for the "archive" deploy account host-setup.sh creates

proxy:
  ssl: false            # no host name: kamal-proxy answers any name on its port

env:
  clear:
    ARCHIVE_NODE_ID: gameforge
    APP_HOST: 192.168.17.97:3920
    APP_PROTOCOL: http
    FORCE_SSL: "false"
    ASSUME_SSL: "false"
    ALLOW_ALL_HOSTS: "true"

volumes:
  - /home/cayuse/archive-peer/gameforge/storage:/rails/storage
  - /home/cayuse/archive-peer/gameforge/intake:/rails/intake
  - archive_peer_logs:/rails/log

accessories:
  db:
    host: 192.168.17.97
    port: "192.168.17.97:5442:5432"     # the private address other peers replicate from
    volumes:
      - /home/cayuse/archive-peer/gameforge/postgres:/var/lib/postgresql/data
  redis:
    host: 192.168.17.97
    volumes:
      - /home/cayuse/archive-peer/gameforge/redis:/data
