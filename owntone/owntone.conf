# OwnTone config for the archive headless jukebox test on bigballs.
# Mounted at /etc/owntone/owntone.conf. Full reference: owntone.conf.in in the
# owntone-server repo.

general {
	uid = "owntone"
	db_path = "/var/cache/owntone/songs3.db"
	logfile = "/var/log/owntone.log"
	loglevel = log
	# Web UI + JSON API are on library.port (3689); this is the event websocket.
	websocket_port = 3688
	# Who may use the web UI / API without a password.
	# The LAN, plus Docker's bridge ranges (172.16.0.0/12): the player daemon runs in a bridged
	# container and reaches this API through the host's address. Prefix match, so one entry each.
	trusted_networks = { "localhost", "192.168", "fd",
		"172.16.", "172.17.", "172.18.", "172.19.", "172.20.", "172.21.", "172.22.", "172.23.",
		"172.24.", "172.25.", "172.26.", "172.27.", "172.28.", "172.29.", "172.30.", "172.31." }
	cache_dir = "/var/cache/owntone/"
	# Silent-HomePod reports on IPv6; the LAN is IPv4 only anyway.
	ipv6 = no
}

library {
	name = "Archive Jukebox"
	port = 3689
	# Empty for now: songs arrive as signed archive URLs on the queue.
	directories = { "/srv/media" }
}

audio {
	# No sound card in the container; AirPlay speakers are the only outputs.
	nickname = "Computer"
	type = "disabled"
}

airplay_shared {
	# Use the "AirPlay 2" bits (buffered audio, PTP) by default; per-speaker
	# overrides go in airplay "Name" { } blocks, e.g. airplay2_disable = true
	# or ptp_disable = true for misbehaving HomePod minis.
}
